name: Release
on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: australia-southeast1-docker.pkg.dev
  REPO_PATH: field-engineering-apac/kasunt

jobs:
  check-ci:
    name: Verify CI passed for this commit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Check latest CI run for current commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          CONCLUSION=$(gh run list --workflow=ci.yml --commit "$SHA" --json conclusion --jq '.[0].conclusion // "missing"')
          if [ "$CONCLUSION" != "success" ]; then
            echo "CI has not passed for $SHA (conclusion: $CONCLUSION). Refusing to release." >&2
            exit 1
          fi

  tag-and-release:
    name: Tag and Release
    runs-on: ubuntu-latest
    needs: [check-ci]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next version
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1); MINOR=$(echo "$VERSION" | cut -d. -f2); PATCH=$(echo "$VERSION" | cut -d. -f3)
          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
            *) echo "ERROR: unknown bump_type '$BUMP_TYPE'" >&2; exit 1 ;;
          esac
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
      - name: Push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"
      - name: Create GitHub Release
        run: gh release create "${{ steps.version.outputs.new_tag }}" --generate-notes --title "${{ steps.version.outputs.new_tag }}"
        env:
          GH_TOKEN: ${{ github.token }}

  build-push:
    name: Build and Push (${{ matrix.service.name }})
    needs: [tag-and-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: catalog-api, dockerfile: catalog-api/Dockerfile }
          - { name: console, dockerfile: console/Dockerfile }
          - { name: bids-mcp, dockerfile: mcp-servers/bids-mcp/Dockerfile }
          - { name: orders-mcp, dockerfile: mcp-servers/orders-mcp/Dockerfile }
          - { name: pricing-mcp, dockerfile: mcp-servers/pricing-mcp/Dockerfile }
          - { name: trust-mcp, dockerfile: mcp-servers/trust-mcp/Dockerfile }
    permissions:
      contents: read
      id-token: write # required for GCP Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      - name: Build and push
        env:
          NEW_TAG: ${{ needs.tag-and-release.outputs.new_tag }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${REPO_PATH}/agora-demo-${{ matrix.service.name }}:${NEW_TAG}"
          docker build --label org.opencontainers.image.version="${NEW_TAG}" \
            --build-arg VERSION="${NEW_TAG}" \
            -f "${{ matrix.service.dockerfile }}" -t "$IMAGE" .
          docker push "$IMAGE"

  create-release:
    name: Update Release with Images
    needs: [tag-and-release, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or update release with image locations
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.tag-and-release.outputs.new_tag }}
        run: |
          set -euo pipefail
          SERVICES="catalog-api console bids-mcp orders-mcp pricing-mcp trust-mcp"
          # tag-and-release already created this release (without the images, which
          # don't exist until build-push above runs) -- append rather than fail,
          # instead of clobbering its auto-generated notes.
          IMAGE_LINES=""
          for service in $SERVICES; do
            IMAGE="${REGISTRY}/${REPO_PATH}/agora-demo-${service}:${NEW_TAG}"
            IMAGE_LINES="${IMAGE_LINES}- \`${IMAGE}\`\n"
          done
          if gh release view "${NEW_TAG}" >/dev/null 2>&1; then
            EXISTING=$(gh release view "${NEW_TAG}" --json body -q .body)
            printf '%s\n\n## Docker Images\n\n%b' "$EXISTING" "$IMAGE_LINES" | gh release edit "${NEW_TAG}" --notes-file -
          else
            printf '## Docker Images\n\n%b' "$IMAGE_LINES" | gh release create "${NEW_TAG}" --title "${NEW_TAG}" --generate-notes --notes-file -
          fi
