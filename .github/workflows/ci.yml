name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_MODULES: ./fixtures/... ./catalog-api/... ./mcp-servers/bids-mcp/... ./mcp-servers/pricing-mcp/... ./mcp-servers/orders-mcp/... ./mcp-servers/trust-mcp/... ./console/...

jobs:
  lint-test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: 'go.work' }
      # console/main.go's //go:embed all:web/dist needs the SPA built first --
      # dist/ is gitignored, so a fresh checkout has no web/dist to embed.
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci && npm run build
        working-directory: console/web
      - run: gofmt -l . | tee /tmp/fmtdiff && [ ! -s /tmp/fmtdiff ]
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: ${{ env.GO_MODULES }}
      - run: mkdir -p /tmp/build-out && go build -o /tmp/build-out/ ${{ env.GO_MODULES }}
      - run: go test ${{ env.GO_MODULES }} -race -v

  lint-test-ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: console/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
