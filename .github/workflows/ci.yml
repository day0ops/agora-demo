name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_MODULES: ./fixtures/... ./catalog-api/... ./mcp-servers/bids-mcp/... ./mcp-servers/pricing-mcp/...

jobs:
  lint-test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: 'go.work' }
      - run: gofmt -l . | tee /tmp/fmtdiff && [ ! -s /tmp/fmtdiff ]
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: ${{ env.GO_MODULES }}
      - run: mkdir -p /tmp/build-out && go build -o /tmp/build-out/ ${{ env.GO_MODULES }}
      - run: go test ${{ env.GO_MODULES }} -race -v
